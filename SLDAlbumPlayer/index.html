<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album review</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --muted:#8c8c8c; --line:rgba(255,255,255,.14); --hi:rgba(255,255,255,.07); }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--fg);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }

  /* Song backgrounds: a soft blurred still per track (backgrounds/blurred/NN.jpg), two layers that crossfade */
  #bg { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: 0;
        pointer-events: none; overflow: hidden; opacity: .38; transition: opacity 1.5s ease; }
  #bg.paused { opacity: .2; }
  #bg div { position: absolute; inset: -8%; background: center / cover no-repeat; opacity: 0;
            transition: opacity 3s ease-in-out; animation: drift 80s ease-in-out infinite alternate; }
  #bg div + div { animation-delay: -40s; }
  #bg div.on { opacity: 1; }
  @keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-2%, 1.5%); } }
  @media (prefers-reduced-motion: reduce) { #bg div { animation: none; } }
  /* Round artwork, turning once every 4 minutes */
  #art { display: block; width: min(100%, 340px); aspect-ratio: 1; height: auto; margin: 8px auto 20px;
         animation: spin 480s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
  #now { border: 1px solid var(--line); background: rgba(17,17,17,.35); padding: 12px; margin-bottom: 24px; }
  #np { font-weight: 600; min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px;
         color: var(--muted); font-variant-numeric: tabular-nums; }
  #seek { flex: 1; min-width: 0; accent-color: #d6d6d6; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; color: var(--fg); background: rgba(255,255,255,.04);
           border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--hi); }
  #play { min-width: 72px; font-weight: 600; }
  #shuffle { margin-left: auto; }
  #shuffle[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin-top: 6px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
       margin: 20px 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  ol { list-style: none; margin: 0; padding: 0; }
  ol button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; padding: 7px 6px; background: none; }
  ol button:hover { background: var(--hi); }
  ol .n { width: 2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  ol .t { flex: 1; min-width: 0; }
  ol .s { color: var(--muted); font-size: 13px; flex: none; }
  li.on button { background: var(--hi); font-weight: 600; }
  li.on .n { color: var(--fg); }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div></div><div></div></div>
<main>
  <img id="art" alt="">
  <h1 id="title">Album review</h1>

  <div id="now">
    <div id="np">Press play to start</div>
    <div class="bar"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="prev">Prev</button>
      <button id="play">Play</button>
      <button id="next">Next</button>
      <button id="shuffle" aria-pressed="false">Shuffle: off</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="list"></div>
  <footer>Plays straight through with no gaps between tracks. Space = play/pause.</footer>
</main>

<script>
// ---------- setup ----------
const $ = id => document.getElementById(id);
let A = {};                 // settings from album.js
let T = [];                 // tracks: { num, title, disc, url }
const S = { order: [], pos: 0, cur: null, nxt: null, gen: 0, playing: false, started: false, loading: false, shuffle: false };
const cache = new Map();    // track index -> Promise<{buf, off, len}>
let ctx = null;
// Opened by double-clicking index.html: browsers block reading files that way, so fall back to plain <audio>.
const LOCAL = location.protocol === 'file:';

function getCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (navigator.audioSession) try { navigator.audioSession.type = 'playback'; } catch (e) {}  // iPhone: play with silent switch on
  }
  return ctx;
}

// Load album.js at a new address each visit, so browsers and caches can't hand out an old track list.
function loadSettings() {
  return new Promise(done => {
    const s = document.createElement('script');
    s.src = LOCAL ? 'album.js' : 'album.js?t=' + Date.now();
    s.onload = s.onerror = () => done(window.ALBUM || {});
    document.head.appendChild(s);
  });
}

// Find the tracks. On GitHub Pages, read the repo's file list so new uploads show up on their own;
// otherwise (or if that fails) use the list in album.js.
async function discover() {
  A = await loadSettings();
  let files = (A.tracks || []).slice(), art = A.artwork || '', ver = {}, name = '';
  const gh = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (gh) {
    const seg = location.pathname.split('/').filter(s => s && !/\.html?$/i.test(s));
    const owner = gh[1], repo = seg[0] || owner + '.github.io', sub = seg.slice(1).join('/');
    name = seg[0] || '';
    try {
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${sub}`, { cache: 'no-cache' });
      if (r.ok) {
        const list = (await r.json()).filter(f => f.type === 'file');
        const songs = list.filter(f => /\.m4a$/i.test(f.name));
        if (songs.length) { files = songs.map(f => f.name); songs.forEach(f => ver[f.name] = f.sha.slice(0, 8)); }
        const imgs = list.filter(f => /\.(png|jpe?g|webp)$/i.test(f.name)).map(f => f.name);
        if (imgs.length && !imgs.includes(art)) art = imgs.find(n => /cover|art/i.test(n)) || imgs[0];
      }
    } catch (e) {}
  }
  const starts = A.discStarts || [1];
  files.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  T = files.map((f, i) => {
    const m = f.match(/^(\d+)/), num = m ? +m[1] : i + 1;
    const title = f.replace(/\.[^.]+$/, '').replace(/^\d+\s*[-._)]*\s*/, '') || 'Track ' + num;
    let disc = 1; starts.forEach((s, d) => { if (num >= s) disc = d + 1; });
    return { num, title, disc, url: encodeURIComponent(f) + (ver[f] ? '?v=' + ver[f] : '') };
  });
  const title = A.title || name.replace(/[-_]+/g, ' ') || 'Album review';
  $('title').textContent = document.title = title;
  if (art) $('art').src = encodeURIComponent(art); else $('art').style.display = 'none';
  S.order = T.map((_, i) => i);
  buildList();
  if (!T.length) status('No .m4a files found.');
  else if (LOCAL) status('Opened from your computer, so there may be tiny gaps between tracks. The web link plays seamlessly.');
}

function buildList() {
  const discs = new Set(T.map(t => t.disc));
  let html = '', lastDisc = 0;
  T.forEach((t, i) => {
    if (t.disc !== lastDisc) {
      if (lastDisc) html += '</ol>';
      html += (discs.size > 1 ? `<h2>Disc ${t.disc}</h2>` : '') + '<ol>';
      lastDisc = t.disc;
    }
    html += `<li id="t${i}"><button data-i="${i}"><span class="n">${t.num}</span><span class="t"></span><span class="s"></span></button></li>`;
  });
  $('list').innerHTML = html + '</ol>';
  T.forEach((t, i) => $('t' + i).querySelector('.t').textContent = t.title);
}

// ---------- loading + gapless trimming ----------
// AAC files carry ~50ms of encoder silence at the start and some padding at the end.
// Read how much from the file (edit list, or iTunes' iTunSMPB tag) and skip it, so tracks butt together exactly.
function gaplessInfo(ab) {
  const v = new DataView(ab), u = new Uint8Array(ab);
  const type = o => String.fromCharCode(u[o], u[o + 1], u[o + 2], u[o + 3]);
  const kids = (s, e) => { const out = []; let o = s;
    while (o + 8 <= e) { let size = v.getUint32(o), h = 8;
      if (size === 1) { size = Number(v.getBigUint64(o + 8)); h = 16; } else if (size === 0) size = e - o;
      if (size < h || o + size > e) break;
      out.push({ t: type(o + 4), s: o + h, e: o + size }); o += size; }
    return out; };
  const get = (b, t) => b && kids(b.s, b.e).find(k => k.t === t);
  const scale = b => v.getUint32(b.s + (u[b.s] === 1 ? 20 : 12));      // timescale in mvhd / mdhd
  const moov = kids(0, u.length).find(k => k.t === 'moov'); if (!moov) return null;
  const movieScale = scale(get(moov, 'mvhd'));
  const trak = kids(moov.s, moov.e).filter(k => k.t === 'trak')
    .find(k => { const h = get(get(k, 'mdia'), 'hdlr'); return h && type(h.s + 8) === 'soun'; });
  if (!trak) return null;
  const mdhd = get(get(trak, 'mdia'), 'mdhd'), rate = scale(mdhd);
  const total = u[mdhd.s] === 1 ? Number(v.getBigUint64(mdhd.s + 24)) : v.getUint32(mdhd.s + 16);  // all samples incl. delay

  // iTunes gapless tag: exact delay and sample count
  let prime = null, len = null;
  const meta = get(get(moov, 'udta'), 'meta');
  const ilst = meta && (get({ s: meta.s + 4, e: meta.e }, 'ilst') || get(meta, 'ilst'));
  for (const k of ilst ? kids(ilst.s, ilst.e) : []) {
    if (k.t !== '----') continue;
    const nm = get(k, 'name'), da = get(k, 'data');
    if (!nm || !da || new TextDecoder().decode(u.subarray(nm.s + 4, nm.e)) !== 'iTunSMPB') continue;
    const f = new TextDecoder().decode(u.subarray(da.s + 8, da.e)).trim().split(/\s+/);
    if (f.length >= 4 && parseInt(f[3], 16) > 0) { prime = parseInt(f[1], 16); len = parseInt(f[3], 16) / rate; }
  }

  // Edit list: delay, and length (sometimes rounded to the millisecond)
  const elst = get(get(trak, 'edts'), 'elst');
  if (elst) {
    const ver = u[elst.s], n = v.getUint32(elst.s + 4); let o = elst.s + 8, segAt = -1, seg = 0, edits = 0, t0 = null;
    for (let i = 0; i < n; i++, o += ver === 1 ? 20 : 12) {
      const d = ver === 1 ? Number(v.getBigUint64(o)) : v.getUint32(o);
      const t = ver === 1 ? Number(v.getBigInt64(o + 8)) : v.getInt32(o + 4);
      if (t < 0) continue;                       // empty edit
      if (t0 === null) { t0 = t; segAt = o; seg = d; }
      edits++;
    }
    if (t0 !== null && edits === 1 && seg > 0) {
      if (prime === null) prime = t0;
      if (len === null) {
        len = seg / movieScale;
        const exact = (total - t0) / rate;       // true length, if the last packet's duration was trimmed
        if (Math.abs(exact - len) <= 1 / movieScale) len = exact;
      }
      // If the edit list was rounded down, browsers cut the last few samples. Round it up instead.
      const want = Math.ceil(len * movieScale - 1e-9);
      if (seg < want) ver === 1 ? v.setBigUint64(segAt, BigInt(want)) : v.setUint32(segAt, want);
    }
  }
  return len ? { prime: (prime || 0) / rate, len } : null;
}

// Some browsers already strip the encoder delay when decoding, some don't. Compare lengths to tell.
function fit(buf, g) {
  let off = 0, len = buf.duration;
  if (g && g.len > 0 && g.len <= buf.duration + 0.01) {
    if (g.prime > 0 && buf.duration - g.len >= g.prime - 0.002) off = g.prime;
    len = Math.min(g.len, buf.duration - off);
  }
  return { buf, off, len };
}

function load(i) {
  if (!cache.has(i)) {
    const p = fetch(T[i].url, { cache: 'no-cache' })      // re-check with the server, so a replaced mix isn't served stale
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(async ab => { let g = null; try { g = gaplessInfo(ab); } catch (e) {}
                          return fit(await getCtx().decodeAudioData(ab), g); });
    p.catch(() => { if (cache.get(i) === p) cache.delete(i); });
    cache.set(i, p);
  }
  return cache.get(i);
}

// Keep only the current and next track decoded (decoded audio is big).
function prune() {
  const keep = new Set([S.order[S.pos], S.order[S.pos + 1]]);
  for (const k of [...cache.keys()]) if (!keep.has(k)) cache.delete(k);
}

// ---------- playback ----------
function sched(p, d, when, offset, g) {
  const src = ctx.createBufferSource();
  src.buffer = d.buf; src.connect(ctx.destination);
  src.start(when, d.off + offset, d.len - offset);
  const n = { p, src, len: d.len, t0: when - offset, end: when + d.len - offset };
  src.onended = () => onEnded(n, g);
  return n;
}

function kill(n) {
  if (!n) return;
  if (n.el) { n.el.onended = n.el.onerror = null; n.el.pause(); return; }
  n.src.onended = null; try { n.src.stop(); } catch (e) {} n.src.disconnect();
}

function endAlbum() { kill(S.cur); kill(S.nxt); S.cur = S.nxt = null; S.started = false; S.playing = false; S.pos = 0; render(); }

// Local-file fallback: one <audio> element per track, next one preloaded. Small gap at each change.
function playLocal(p, offset, resume) {
  const t = S.order[p];
  if (S.cur && S.cur.el && S.cur.p === p && S.cur.t === t) {      // same track: just seek
    S.cur.el.currentTime = offset; S.playing = resume; resume ? S.cur.el.play() : S.cur.el.pause();
    return render();
  }
  const g = ++S.gen, reuse = S.nxt && S.nxt.t === t ? S.nxt : null;
  kill(S.cur); if (!reuse) kill(S.nxt); S.nxt = null;
  const el = reuse ? reuse.el : new Audio(T[t].url);
  S.pos = p; S.started = true; S.playing = resume; S.loading = false;
  S.cur = { p, t, el, get len() { return el.duration || 0; } };
  el.onended = () => { if (g === S.gen) S.cur.p + 1 < S.order.length ? playLocal(S.cur.p + 1, 0, true) : endAlbum(); };
  el.onerror = () => { if (g !== S.gen) return; S.playing = false; status(`Couldn't play "${T[t].title}".`); render(); };
  if (offset) el.readyState ? el.currentTime = offset : el.addEventListener('loadedmetadata', () => el.currentTime = offset, { once: true });
  if (resume) el.play().catch(() => {});
  render();
  queueNext(g);
}

async function playAt(p, offset = 0, resume = true) {
  if (p < 0 || p >= S.order.length) return;
  if (LOCAL) return playLocal(p, offset, resume);
  const c = getCtx(), g = ++S.gen;
  kill(S.cur); kill(S.nxt); S.cur = S.nxt = null;
  S.pos = p; S.started = true; S.playing = resume; S.loading = true;
  resume ? c.resume() : c.suspend();
  status(''); render();
  let d;
  try { d = await load(S.order[p]); }
  catch (e) {
    if (g !== S.gen) return;
    S.loading = false; S.playing = false;
    status(`Couldn't play "${T[S.order[S.pos]].title}" (${e.message || 'unsupported file'}).`);
    return render();
  }
  if (g !== S.gen) return;
  S.loading = false;
  offset = Math.max(0, Math.min(offset, d.len - 0.05));
  S.cur = sched(S.pos, d, c.currentTime + 0.05, offset, g);
  prune(); render();
  queueNext(g);
}

// Decode the next track and schedule it to start on the exact sample the current one ends.
async function queueNext(g) {
  if (!S.cur) return;
  const p = S.cur.p + 1; if (p >= S.order.length) return;
  const t = S.order[p];
  if (LOCAL) { const el = new Audio(T[t].url); el.preload = 'auto'; S.nxt = { p, t, el }; return; }
  let d; try { d = await load(t); } catch (e) { return; }
  if (g !== S.gen || !S.cur || S.cur.p !== p - 1 || S.order[p] !== t || S.nxt) return;
  S.nxt = sched(p, d, Math.max(S.cur.end, ctx.currentTime + 0.02), 0, g);
}

function onEnded(n, g) {
  if (g !== S.gen || n !== S.cur) return;
  n.src.disconnect();
  if (S.nxt) { S.cur = S.nxt; S.nxt = null; S.pos = S.cur.p; prune(); render(); queueNext(g); }
  else if (n.p + 1 < S.order.length) playAt(n.p + 1, 0, S.playing);     // next wasn't ready in time
  else endAlbum();
}

function toggle() {
  if (!S.started) return playAt(S.pos);
  S.playing = !S.playing;
  if (LOCAL) S.playing ? S.cur.el.play() : S.cur.el.pause();
  else { const c = getCtx(); S.playing ? c.resume() : c.suspend(); }
  render();
}

function elapsed() {
  if (!S.cur) return 0;
  if (S.cur.el) return S.cur.el.currentTime || 0;
  return Math.max(0, Math.min(S.cur.len, ctx.currentTime - S.cur.t0));
}

function setShuffle(on) {
  S.shuffle = on;
  const curT = S.started ? S.order[S.pos] : null;
  let order = T.map((_, i) => i);
  if (on) {
    order = order.filter(i => i !== curT);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    if (curT !== null) order.unshift(curT);
  }
  S.order = order;
  S.pos = curT === null ? 0 : order.indexOf(curT);
  if (S.cur) S.cur.p = S.pos;
  kill(S.nxt); S.nxt = null;
  if (S.cur) queueNext(S.gen);
  prune(); render();
}

// ---------- song backgrounds ----------
// Track 5 uses backgrounds/blurred/05.jpg. A song without one fades to plain black.
const bgLayers = [...document.querySelectorAll('#bg div')], bgSeen = {};
let bgOn = 0, bgWant = null, bgTok = 0;
const bgUrl = t => t ? 'backgrounds/blurred/' + String(t.num).padStart(2, '0') + '.jpg' : null;
function bgLoad(url) {
  if (!bgSeen[url]) bgSeen[url] = new Promise(ok => {
    const im = new Image(); im.onload = () => ok(true); im.onerror = () => ok(false); im.src = url; });
  return bgSeen[url];
}
async function setBg(url) {
  if (url === bgWant) return;
  bgWant = url;
  const ok = url ? await bgLoad(url) : false;
  if (bgWant !== url) return;                         // a newer song took over while this one loaded
  const old = bgLayers[bgOn], tok = ++bgTok;
  if (!ok) return bgLayers.forEach(l => l.classList.remove('on'));   // fade to plain black
  // Fade the new picture in on top of the old one, then drop the old one: a true crossfade, no dip to black.
  const nu = bgLayers[bgOn = 1 - bgOn];
  nu.style.transition = 'none'; nu.classList.remove('on'); void nu.offsetWidth; nu.style.transition = '';
  nu.style.backgroundImage = `url("${url}")`;
  nu.style.zIndex = 2; old.style.zIndex = 1;
  nu.classList.add('on');
  setTimeout(() => { if (tok === bgTok) old.classList.remove('on'); }, 3100);
}

// ---------- UI ----------
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function status(msg) { $('status').textContent = msg; }

function render() {
  const i = S.order[S.pos], t = T[i];
  setBg(S.started ? bgUrl(t) : null);
  $('bg').classList.toggle('paused', S.started && !S.playing);
  if (S.started && T[S.order[S.pos + 1]]) bgLoad(bgUrl(T[S.order[S.pos + 1]]));   // get the next one ready
  $('play').textContent = S.playing ? 'Pause' : 'Play';
  $('shuffle').textContent = 'Shuffle: ' + (S.shuffle ? 'on' : 'off');
  $('shuffle').setAttribute('aria-pressed', S.shuffle);
  $('np').textContent = S.started && t ? `${new Set(T.map(x => x.disc)).size > 1 ? 'Disc ' + t.disc + ' · ' : ''}${t.num}. ${t.title}` : 'Press play to start';
  T.forEach((_, k) => {
    const li = $('t' + k), on = S.started && k === i;
    li.classList.toggle('on', on);
    li.querySelector('.s').textContent = on && S.loading ? 'loading…' : on ? (S.playing ? '▶︎' : 'paused') : '';
  });
  tick();
}

let dragging = false;
function tick() {
  if (dragging) return;
  const len = S.cur ? S.cur.len : 0, e = elapsed();
  $('cur').textContent = fmt(e);
  $('dur').textContent = fmt(len);
  $('seek').value = len ? Math.round(e / len * 1000) : 0;
}
setInterval(tick, 250);

$('play').onclick = toggle;
$('next').onclick = () => S.pos + 1 < S.order.length && playAt(S.pos + 1);
$('prev').onclick = () => (S.cur && elapsed() > 3) || S.pos === 0 ? playAt(S.pos) : playAt(S.pos - 1);
$('shuffle').onclick = () => setShuffle(!S.shuffle);
$('list').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) playAt(S.order.indexOf(+b.dataset.i)); };
$('seek').oninput = () => { dragging = true; if (S.cur) $('cur').textContent = fmt($('seek').value / 1000 * S.cur.len); };
$('seek').onchange = () => { dragging = false; if (S.cur) playAt(S.pos, $('seek').value / 1000 * S.cur.len, S.playing); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|BUTTON|TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); toggle(); }
});

window.player = { S, T: () => T, playAt, setShuffle, gaplessInfo, fit };   // handy for debugging
discover().then(render);
</script>
</body>
</html>
